<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Prophetero · Scene Planner</title><link rel="stylesheet" href="assets/planner.css"></head><body>
<header><div><span class="brand">PROPHETERO · SCENE PLANNER 0.2.0-beta.1 · PUBLIC BETA</span> <button id="seen" aria-label="Dismiss NEW badge">NEW ×</button><h1 data-t="title">Plan the scene. See the frame.</h1><p data-t="subtitle"></p></div><label><span data-t="language"></span><select id="language"><option>EN</option><option>HU</option><option>DE</option><option>FR</option><option>ES</option><option>IT</option><option>PT</option><option>PL</option></select></label></header>
<main>
<section class="panel" id="sourceSection"><div class="toolbar"><h2 data-t="source"></h2><button id="new" data-t="new"></button><button id="save" data-t="save"></button><label class="button"><span data-t="load"></span><input id="load" type="file" accept=".json,application/json" hidden></label><span id="draftStatus" role="status"></span></div>
<div class="toolbar"><label><span data-t="template"></span><select id="template"><option value="dasiwa-simple">DaSiWa · Simple</option><option value="dasiwa-pro">DaSiWa · Pro</option><option value="eros-simple">Eros · Simple</option><option value="eros-pro">Eros · Pro</option></select></label><button id="useTemplate" data-t="useTemplate"></button><label class="button"><span data-t="import"></span><input id="workflow" type="file" accept=".json,application/json" hidden></label></div><label class="keep-plan"><input id="keepPlan" type="checkbox" checked><span data-t="keepPlan"></span></label><p class="notice" data-t="sourceHelp"></p><p id="sourceInfo"></p><details><summary data-t="help"></summary><ol><li data-t="help1"></li><li data-t="help2"></li><li data-t="help3"></li><li data-t="help4"></li></ol><p data-t="limits"></p></details></section>
<section class="panel" id="sourceLoras"></section>
<div id="status" role="status" aria-live="polite"></div>
<div class="workspace">
<section class="panel preview"><div class="toolbar"><h2 data-t="preview"></h2><button id="large" data-t="large"></button></div><div id="drop" tabindex="0" role="button"><canvas id="canvas" width="1344" height="768" aria-label="Image fitting preview"></canvas><div id="empty" data-t="drop"></div></div><p id="imageInfo"></p><p class="muted" data-t="dragHelp"></p><div class="toolbar"><label class="button primary"><span data-t="addImage"></span><input id="images" type="file" accept="image/png,image/jpeg,image/webp" multiple hidden></label><button id="downloadImage" data-t="downloadImage"></button></div><p class="notice" data-t="previewLimit"></p></section>
<div class="settings">
<section class="panel"><h2 data-t="canvasTitle"></h2><div class="columns"><label><span data-t="canvas"></span><select id="preset"><option value="landscape">1344 × 768</option><option value="portrait">768 × 1344</option><option value="square">768 × 768</option><option value="trial-landscape">768 × 448</option><option value="trial-portrait">448 × 768</option><option value="square-512">512 × 512</option><option value="1024-landscape">1024 × 576</option><option value="1024-portrait">576 × 1024</option><option value="1088-landscape">1088 × 608</option><option value="1088-portrait">608 × 1088</option><option value="1280-landscape">1280 × 704</option><option value="1280-portrait">704 × 1280</option><option value="square-1024">1024 × 1024</option><option value="fullhd-landscape">1920 × 1088</option><option value="fullhd-portrait">1088 × 1920</option><option value="custom" data-t="customCanvas"></option></select></label><label><span data-t="duration"></span><input id="seconds" type="number" value="8" min="1" max="15" step=".5"></label></div><div id="customCanvas" class="columns" hidden><label><span data-t="width"></span><input id="customWidth" type="number" min="256" max="4096" step="32" value="1344"></label><label><span data-t="height"></span><input id="customHeight" type="number" min="256" max="4096" step="32" value="768"></label></div><p id="canvasInfo" class="notice"></p><p class="muted" data-t="canvasHelp"></p><p class="notice" data-t="aspectHelp"></p><p id="aspectSuggestion"></p><button id="useImageAspect" type="button" data-t="useImageAspect" disabled></button><button id="useImageSize" type="button" data-t="useImageSize" disabled></button><p id="timing"></p><p class="notice" data-t="timingHelp"></p><p class="duration-warning" data-t="durationAuthority"></p></section>
<section class="panel"><h2 data-t="keyframes"></h2><div id="timeline" aria-label="Keyframe timeline"></div><div id="cards"></div><div id="imageControls" hidden><h3 data-t="selected"></h3><div class="columns"><label><span data-t="role"></span><select id="role"><option value="start" data-t="start"></option><option value="guide" data-t="guide"></option><option value="end" data-t="end"></option></select></label><label><span data-t="time"></span><input id="time" type="number" min="0" step=".042"></label><label><span data-t="fit"></span><select id="fit"><option value="cover" data-t="cover"></option><option value="contain" data-t="contain"></option><option value="stretch" data-t="stretch"></option></select></label><label><span data-t="background"></span><input id="background" type="color" value="#101820"></label></div><label><span data-t="horizontal"></span><input id="x" type="range" min="0" max="1" step=".001"></label><label><span data-t="vertical"></span><input id="y" type="range" min="0" max="1" step=".001"></label><div class="toolbar"><button id="center" data-t="center"></button><button id="remove" class="danger" data-t="remove"></button></div><p id="fitWarning"></p></div></section>
</div></div>
<section class="panel" id="resources"></section>
<section class="panel" id="audioPlan"></section>
<section class="panel"><div class="toolbar"><h2 data-t="events"></h2><button id="addEvent" data-t="addEvent"></button></div><p data-t="eventHelp"></p><div id="events"></div></section>
<section class="panel"><h2 data-t="promptTitle"></h2><label><span data-t="base"></span><textarea id="base" rows="5"></textarea></label><button id="assemble" data-t="assemble"></button><label><span data-t="prompt"></span><textarea id="prompt" rows="7"></textarea></label><button id="copy" data-t="copy"></button><button id="openTranslator" type="button" data-t="translateText"></button><p class="muted" data-t="english"></p></section>
<section class="panel" id="translator"></section>
<section class="panel"><h2 data-t="exportTitle"></h2><div id="review"></div><p id="exportTiming" class="duration-warning"></p><p class="duration-warning" data-t="durationAuthority"></p><div id="checks"></div><button id="goSource" type="button" data-t="goSource" hidden></button><button id="export" class="primary" data-t="export"></button><p data-t="exportHelp"></p><p id="exportPath"></p></section>
<footer><p data-t="credits"></p><p data-t="privacy"></p></footer></main>
<script type="module" src="assets/planner.mjs"></script></body></html>
